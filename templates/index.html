
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Freshness Classification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <nav class="navbar">
            <h2>FishFresh</h2>
            <span>Fish Freshness Detection</span>
        </nav>

        <section class="hero">
            <h1>Fish Freshness Classification</h1>
            
        </section>

        <section class="upload-card">
            <h2>Upload Fish Image</h2>
            <p>Select an image of a fish eye to start the classification.</p>

            <form id="uploadForm">
                <label for="imageInput" class="upload-area">
                    <div class="upload-icon">📷</div>
                    <h3>Choose an Image</h3>
                    <p>Click here to select your image</p>
                    <input type="file" id="imageInput" accept="image/*" hidden>
                </label>

                <div id="previewContainer" class="preview-container">
                    <img id="imagePreview" src="" alt="Image Preview">
                </div>

                <button type="submit" id="predictButton">
                    Predict Freshness
                </button>
            </form>

            <div id="result" class="result"></div>
        </section>

        <footer>
            <p>FishFresh - Fish Freshness Classification System</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
